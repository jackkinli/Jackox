name: Build & Deploy (Web PWA)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1-stable"
  GODOT_TEMPLATES_DIRNAME: "4.4.1.stable"
  EXPORT_DIR: "builds/web"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget ca-certificates python3

      - name: Locate Godot project directory
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_FILE="$(find . -name project.godot -print -quit)"
          if [ -z "${PROJECT_FILE:-}" ]; then
            echo "ERROR: Could not find project.godot in repo."
            exit 1
          fi
          PROJECT_DIR="$(cd "$(dirname "$PROJECT_FILE")" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project.godot at: $PROJECT_FILE"
          echo "Using PROJECT_DIR: $PROJECT_DIR"

      - name: Download Godot headless
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          GODOT_ZIP="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          wget -O .cache/godot/godot.zip "$URL"
          unzip -o .cache/godot/godot.zip -d .cache/godot
          chmod +x ".cache/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "$GITHUB_WORKSPACE/.cache/godot" >> "$GITHUB_PATH"

      - name: Install export templates (tpz is a ZIP)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          TPZ="Godot_v${GODOT_VERSION}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${TPZ}"
          wget --tries=5 --timeout=60 -O .cache/godot/templates.tpz "$URL"

          DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIRNAME}"
          mkdir -p "$DEST"

          TMP="$(mktemp -d)"
          unzip -q -o .cache/godot/templates.tpz -d "$TMP"

          if [ -d "$TMP/templates" ]; then
            cp -a "$TMP/templates/." "$DEST/"
          else
            cp -a "$TMP/." "$DEST/"
          fi

          echo "Installed templates to: $DEST"
          ls -la "$DEST" | head -n 80
          test -f "$DEST/web_release.zip"
          test -f "$DEST/web_debug.zip"

      - name: Ensure Web export preset exists (next to project.godot)
        shell: bash
        run: |
          set -euxo pipefail
          PRESETS="$PROJECT_DIR/export_presets.cfg"

          if [ ! -f "$PRESETS" ]; then
            echo "No export_presets.cfg found — creating one with a Web preset."
            {
              echo '[preset.0]'
              echo 'name="Web"'
              echo 'platform="Web"'
              echo 'runnable=true'
              echo 'dedicated_server=false'
              echo 'custom_features=""'
              echo 'export_filter="all_resources"'
              echo 'include_filter=""'
              echo 'exclude_filter=""'
              echo 'export_path="builds/web/index.html"'
              echo 'encryption_include_filters=""'
              echo 'encryption_exclude_filters=""'
              echo 'encrypt_pck=false'
              echo 'encrypt_directory=false'
              echo 'script_export_mode=1'
              echo ''
              echo '[preset.0.options]'
            } > "$PRESETS"
          else
            if ! grep -q 'platform="Web"' "$PRESETS"; then
              echo "export_presets.cfg exists but has no Web preset — appending one."
              {
                echo ''
                echo '[preset.99]'
                echo 'name="Web"'
                echo 'platform="Web"'
                echo 'runnable=true'
                echo 'dedicated_server=false'
                echo 'custom_features=""'
                echo 'export_filter="all_resources"'
                echo 'include_filter=""'
                echo 'exclude_filter=""'
                echo 'export_path="builds/web/index.html"'
                echo 'encryption_include_filters=""'
                echo 'encryption_exclude_filters=""'
                echo 'encrypt_pck=false'
                echo 'encrypt_directory=false'
                echo 'script_export_mode=1'
                echo ''
                echo '[preset.99.options]'
              } >> "$PRESETS"
            fi
          fi

          echo "----- export_presets.cfg (first 200 lines) -----"
          sed -n '1,200p' "$PRESETS"

      - name: Export Web build (always to repo-root builds/web)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/${EXPORT_DIR}"

          Godot_v${GODOT_VERSION}_linux.x86_64 --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-release "Web" "$GITHUB_WORKSPACE/${EXPORT_DIR}/index.html"

          ls -la "$GITHUB_WORKSPACE/${EXPORT_DIR}" | head -n 80
          test -f "$GITHUB_WORKSPACE/${EXPORT_DIR}/index.html"

      - name: Add PWA files (manifest + service worker)
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/${EXPORT_DIR}"

          test -f "$GITHUB_WORKSPACE/pwa/manifest.webmanifest"
          test -f "$GITHUB_WORKSPACE/pwa/icon-192.png"
          test -f "$GITHUB_WORKSPACE/pwa/icon-512.png"
          test -f "$GITHUB_WORKSPACE/pwa/sw.js"

          cp "$GITHUB_WORKSPACE/pwa/manifest.webmanifest" "$OUT/manifest.webmanifest"
          cp "$GITHUB_WORKSPACE/pwa/icon-192.png" "$OUT/icon-192.png"
          cp "$GITHUB_WORKSPACE/pwa/icon-512.png" "$OUT/icon-512.png"

          python3 -c "import os,json; root='$OUT'; files=[]; \
for r,ds,fs in os.walk(root): \
  for f in fs: \
    if f in ('sw.js','_precache.json'): continue; \
    p=os.path.join(r,f); rel=os.path.relpath(p,root).replace('\\\\','/'); files.append('./'+rel); \
files.sort(); open(os.path.join(root,'_precache.json'),'w').write(json.dumps(files))"

          python3 -c "import os,json; root='$OUT'; tpl=open('$GITHUB_WORKSPACE/pwa/sw.js','r',encoding='utf-8').read(); \
pre=json.load(open(os.path.join(root,'_precache.json'),'r')); \
open(os.path.join(root,'sw.js'),'w',encoding='utf-8').write(tpl.replace('__PRECACHE__', json.dumps(pre)))"

          python3 -c "import re,os; p=os.path.join('$OUT','index.html'); html=open(p,'r',encoding='utf-8').read(); \
if 'manifest.webmanifest' not in html: \
  html=re.sub(r'(</head>)','  <link rel=\"manifest\" href=\"manifest.webmanifest\">\\n  <meta name=\"theme-color\" content=\"#0f1115\">\\n\\\\1',html,flags=re.I); \
if 'navigator.serviceWorker' not in html: \
  sn='\\n<script>\\nif (\\x27serviceWorker\\x27 in navigator) {\\n  window.addEventListener(\\x27load\\x27, () => navigator.serviceWorker.register(\\x27./sw.js\\x27));\\n}\\n</script>\\n'; \
  html=re.sub(r'(</body>)', sn+'\\\\1', html, flags=re.I); \
open(p,'w',encoding='utf-8').write(html)"

          rm -f "$OUT/_precache.json"
          echo "PWA injected OK."
          ls -la "$OUT" | head -n 80

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
