name: Build & Deploy (Web PWA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1-stable"
  GODOT_RELEASE_TAG: "4.4.1-stable"
  GODOT_TEMPLATES_DIRNAME: "4.4.1.stable"
  EXPORT_DIR: "builds/web"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget ca-certificates

      - name: Download Godot headless
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          wget -O .cache/godot/godot.zip "$URL"
          unzip -o .cache/godot/godot.zip -d .cache/godot
          chmod +x .cache/godot/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Download + install export templates (web)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          wget --tries=8 --timeout=60 -O .cache/godot/templates.tpz "$URL"

          TEMPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIRNAME}"
          mkdir -p "$TEMPL_DIR"

          # Godot .tpz is a ZIP, not a tar. Extract web-related templates + version.
          unzip -q -o -j .cache/godot/templates.tpz \
            "templates/web_debug.zip" \
            "templates/web_release.zip" \
            "templates/web_nothreads_debug.zip" \
            "templates/web_nothreads_release.zip" \
            "templates/web_dlink_debug.zip" \
            "templates/web_dlink_release.zip" \
            "templates/web_dlink_nothreads_debug.zip" \
            "templates/web_dlink_nothreads_release.zip" \
            "templates/version.txt" \
            -d "$TEMPL_DIR"

          echo "Templates installed to: $TEMPL_DIR"
          ls -la "$TEMPL_DIR"
          test -f "$TEMPL_DIR/version.txt"
          test -f "$TEMPL_DIR/web_release.zip"

      - name: CI patch export_presets.cfg (keep ONLY Web preset)
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$GITHUB_WORKSPACE/export_presets.cfg"
          cp "$GITHUB_WORKSPACE/export_presets.cfg" "$GITHUB_WORKSPACE/export_presets.cfg.bak"

          python3 - << 'PY'
          import re, pathlib
          p = pathlib.Path("export_presets.cfg")
          s = p.read_text(encoding="utf-8", errors="ignore")

          # Grab the Web preset block (both [preset.N] and [preset.N.options])
          m = re.search(r'(\[preset\.(\d+)\][\s\S]*?name="Web"[\s\S]*?)(?=(\n\[preset\.\d+\])|\Z)', s)
          if not m:
            raise SystemExit('Could not find a preset with name="Web" in export_presets.cfg')

          block = m.group(1)
          n = m.group(2)

          # Renumber preset headers to preset.0
          block = re.sub(rf'\[preset\.{n}\]', '[preset.0]', block)
          block = re.sub(rf'\[preset\.{n}\.options\]', '[preset.0.options]', block)

          # Ensure export_path points to builds/web/index.html (safe default)
          block = re.sub(r'export_path="[^"]*"', 'export_path="builds/web/index.html"', block)

          p.write_text(block.strip() + "\n", encoding="utf-8")
          print("Wrote CI-only export_presets.cfg containing ONLY the Web preset as preset.0")
          PY

          echo "----- export_presets.cfg (CI) -----"
          cat "$GITHUB_WORKSPACE/export_presets.cfg"
          echo "----------------------------------"

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${EXPORT_DIR}"

          set +e
          .cache/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --verbose --path "$GITHUB_WORKSPACE" \
            --export-release "Web" "${EXPORT_DIR}/index.html" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          set -e

          echo "----- LAST 200 LINES export.log -----"
          tail -n 200 export.log || true
          echo "-------------------------------------"
          exit "$status"

      - name: Add PWA files (manifest + service worker)
        shell: bash
        run: |
          set -euxo pipefail
          cd "${EXPORT_DIR}"

          cp "$GITHUB_WORKSPACE/pwa/manifest.webmanifest" ./manifest.webmanifest
          cp "$GITHUB_WORKSPACE/pwa/icon-192.png" ./icon-192.png
          cp "$GITHUB_WORKSPACE/pwa/icon-512.png" ./icon-512.png

          python3 - << 'PY'
          import os, json
          files=[]
          for root, _, filenames in os.walk("."):
            for f in filenames:
              if f == "sw.js":
                continue
              p=os.path.join(root,f).replace("\\","/")
              if p.startswith("./"):
                p=p[2:]
              files.append("./"+p)
          files.sort()
          with open("_precache.json","w") as fp:
            json.dump(files, fp)
          PY

          python3 - << 'PY'
          import json
          tpl=open("$GITHUB_WORKSPACE/pwa/sw.js","r",encoding="utf-8").read()
          precache=json.load(open("_precache.json","r"))
          out=tpl.replace("__PRECACHE__", json.dumps(precache))
          open("sw.js","w",encoding="utf-8").write(out)
          PY

          python3 - << 'PY'
          import re
          html=open("index.html","r",encoding="utf-8").read()

          if "manifest.webmanifest" not in html:
            html=re.sub(r"(</head>)", '  <link rel="manifest" href="manifest.webmanifest">\\n  <meta name="theme-color" content="#0f1115">\\n\\1', html, flags=re.I)

          if "navigator.serviceWorker" not in html:
            snippet="\\n<script>\\nif ('serviceWorker' in navigator) {\\n  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));\\n}\\n</script>\\n"
            html=re.sub(r"(</body>)", snippet + "\\1", html, flags=re.I)

          open("index.html","w",encoding="utf-8").write(html)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}

      - name: Upload export.log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
