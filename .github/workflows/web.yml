name: Build & Deploy (Web PWA)

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1-stable"
  GODOT_TEMPLATES_DIRNAME: "4.4.1.stable"
  EXPORT_DIR: "builds/web"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget ca-certificates python3

      - name: Download Godot headless
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          GODOT_ZIP="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          wget -O .cache/godot/godot.zip "$URL"
          unzip -o .cache/godot/godot.zip -d .cache/godot
          chmod +x ".cache/godot/Godot_v${GODOT_VERSION}_linux.x86_64"

      - name: Install export templates (tpz is a ZIP)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          TPZ="Godot_v${GODOT_VERSION}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${TPZ}"
          wget --tries=5 --timeout=60 -O .cache/godot/templates.tpz "$URL"

          DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIRNAME}"
          mkdir -p "$DEST"

          TMPDIR="$(mktemp -d)"
          unzip -q -o .cache/godot/templates.tpz -d "$TMPDIR"

          # Godot tpz layout is usually TMPDIR/templates/<files>
          if [ -d "$TMPDIR/templates" ]; then
            cp -a "$TMPDIR/templates/." "$DEST/"
          else
            cp -a "$TMPDIR/." "$DEST/"
          fi

          echo "Installed templates to: $DEST"
          ls -la "$DEST" | head -n 80
          test -f "$DEST/web_release.zip"

      - name: Ensure Web export preset exists
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          presets = Path("export_presets.cfg")

          web_block = textwrap.dedent("""\
          [preset.99]
          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="builds/web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=1

          [preset.99.options]
          """)

          # Strip the indentation we introduced for YAML readability:
          web_block = "\n".join(line.lstrip() for line in web_block.splitlines()).strip() + "\n"

          if not presets.exists():
              presets.write_text(web_block.replace("[preset.99]", "[preset.0]"), encoding="utf-8")
          else:
              txt = presets.read_text(encoding="utf-8", errors="ignore")
              if 'platform="Web"' not in txt:
                  presets.write_text(txt.rstrip() + "\n\n" + web_block, encoding="utf-8")

          print("----- export_presets.cfg (first 140 lines) -----")
          lines = presets.read_text(encoding="utf-8", errors="ignore").splitlines()
          for i, line in enumerate(lines[:140], 1):
              print(f"{i:03d}: {line}")
          PY

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${EXPORT_DIR}"

          .cache/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Web" "${EXPORT_DIR}/index.html"

          ls -la "${EXPORT_DIR}" | head -n 120
          test -f "${EXPORT_DIR}/index.html"

      - name: Add PWA files (manifest + service worker)
        shell: bash
        run: |
          set -euxo pipefail

          OUT="$GITHUB_WORKSPACE/${EXPORT_DIR}"
          cd "$OUT"

          cp "$GITHUB_WORKSPACE/pwa/manifest.webmanifest" ./manifest.webmanifest
          cp "$GITHUB_WORKSPACE/pwa/icon-192.png" ./icon-192.png
          cp "$GITHUB_WORKSPACE/pwa/icon-512.png" ./icon-512.png

          python3 - <<'PY'
          import os, json

          files=[]
          for root, _, filenames in os.walk("."):
              for f in filenames:
                  if f in ("sw.js", "_precache.json"):
                      continue
                  p=os.path.join(root,f).replace("\\","/")
                  if p.startswith("./"):
                      p=p[2:]
                  files.append("./"+p)

          files.sort()
          with open("_precache.json","w",encoding="utf-8") as fp:
              json.dump(files, fp)
          PY

          python3 - <<'PY'
          import os, json

          root=os.environ["GITHUB_WORKSPACE"]
          tpl=open(os.path.join(root,"pwa","sw.js"),"r",encoding="utf-8").read()
          precache=json.load(open("_precache.json","r",encoding="utf-8"))
          out=tpl.replace("__PRECACHE__", json.dumps(precache))
          open("sw.js","w",encoding="utf-8").write(out)
          PY

          python3 - <<'PY'
          import re

          html=open("index.html","r",encoding="utf-8").read()

          if "manifest.webmanifest" not in html:
              html=re.sub(
                  r"(</head>)",
                  '  <link rel="manifest" href="manifest.webmanifest">\\n'
                  '  <meta name="theme-color" content="#0f1115">\\n\\1',
                  html,
                  flags=re.I,
              )

          if "navigator.serviceWorker" not in html:
              snippet="\\n<script>\\nif ('serviceWorker' in navigator) {\\n  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));\\n}\\n</script>\\n"
              html=re.sub(r"(</body>)", snippet + "\\1", html, flags=re.I)

          open("index.html","w",encoding="utf-8").write(html)
          PY

          rm -f _precache.json
          ls -la | head -n 120

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
