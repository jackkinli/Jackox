name: Build & Deploy (Web PWA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1-stable"
  GODOT_TEMPLATES_DIRNAME: "4.4.1.stable"
  EXPORT_NAME: "Blox3D"
  EXPORT_DIR: "builds/web"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget ca-certificates python3

      - name: Download Godot headless
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          GODOT_ZIP="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          wget -O .cache/godot/godot.zip "$URL"
          unzip -o .cache/godot/godot.zip -d .cache/godot
          chmod +x ".cache/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "$GITHUB_WORKSPACE/.cache/godot" >> "$GITHUB_PATH"

      - name: Install export templates (tpz is a ZIP)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          TPZ="Godot_v${GODOT_VERSION}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${TPZ}"
          wget --tries=5 --timeout=60 -O .cache/godot/templates.tpz "$URL"

          DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIRNAME}"
          mkdir -p "$DEST"

          TMP="$(mktemp -d)"
          unzip -q -o .cache/godot/templates.tpz -d "$TMP"

          # Godot tpz layout is usually: TMP/templates/<files>
          if [ -d "$TMP/templates" ]; then
            cp -a "$TMP/templates/." "$DEST/"
          else
            cp -a "$TMP/." "$DEST/"
          fi

          echo "Installed templates to: $DEST"
          ls -la "$DEST" | head -n 50
          test -f "$DEST/web_release.zip"

      - name: Ensure Web export preset exists
        shell: bash
        run: |
          set -euxo pipefail
          PRESETS="export_presets.cfg"

          if [ ! -f "$PRESETS" ]; then
            echo "No export_presets.cfg found — creating one with a Web preset."
            cat > "$PRESETS" <<'CFG'
[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]
CFG
          else
            # If file exists but doesn't contain a Web preset, append one
            if ! grep -q 'platform="Web"' "$PRESETS"; then
              echo "export_presets.cfg exists but has no Web preset — appending one."
              cat >> "$PRESETS" <<'CFG'

[preset.99]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.99.options]
CFG
            fi
          fi

          echo "----- export_presets.cfg (first 120 lines) -----"
          sed -n '1,120p' "$PRESETS"

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${EXPORT_DIR}"

          # Use the binary from PATH (added earlier)
          Godot_v${GODOT_VERSION}_linux.x86_64 --headless --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Web" "${EXPORT_DIR}/index.html"

          ls -la "${EXPORT_DIR}" | head -n 80
          test -f "${EXPORT_DIR}/index.html"

      - name: Add PWA files (manifest + service worker)
        shell: bash
        run: |
          set -euxo pipefail
          cd "${EXPORT_DIR}"

          # Copy PWA assets from repo (these should exist in your project)
          cp "$GITHUB_WORKSPACE/pwa/manifest.webmanifest" ./manifest.webmanifest
          cp "$GITHUB_WORKSPACE/pwa/icon-192.png" ./icon-192.png
          cp "$GITHUB_WORKSPACE/pwa/icon-512.png" ./icon-512.png

          # Build a precache list (relative URLs)
          python3 - << 'PY'
          import os, json
          files=[]
          for root, dirs, filenames in os.walk("."):
            for f in filenames:
              if f in ("sw.js", "_precache.json"):
                continue
              p=os.path.join(root,f).replace("\\","/")
              if p.startswith("./"):
                p=p[2:]
              files.append("./"+p)
          files.sort()
          with open("_precache.json","w") as fp:
            json.dump(files, fp)
          PY

          # Create sw.js with embedded precache list
          python3 - << 'PY'
          import json
          tpl=open(os.path.join(os.environ["GITHUB_WORKSPACE"],"pwa","sw.js"),"r",encoding="utf-8").read()
          precache=json.load(open("_precache.json","r"))
          out=tpl.replace("__PRECACHE__", json.dumps(precache))
          open("sw.js","w",encoding="utf-8").write(out)
          PY

          # Inject manifest + service worker registration into index.html
          python3 - << 'PY'
          import re
          html=open("index.html","r",encoding="utf-8").read()

          if "manifest.webmanifest" not in html:
            html=re.sub(r"(</head>)", '  <link rel="manifest" href="manifest.webmanifest">\\n  <meta name="theme-color" content="#0f1115">\\n\\1', html, flags=re.I)

          if "navigator.serviceWorker" not in html:
            snippet="""\\n<script>\\nif ('serviceWorker' in navigator) {\\n  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));\\n}\\n</script>\\n"""
            html=re.sub(r"(</body>)", snippet + "\\1", html, flags=re.I)

          open("index.html","w",encoding="utf-8").write(html)
          PY

          rm -f _precache.json
          echo "PWA injected OK."
          ls -la | head -n 80

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
