name: Build & Deploy (Web PWA)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1-stable"
  GODOT_TEMPLATES_DIRNAME: "4.4.1.stable"
  EXPORT_DIR: "builds/web"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget ca-certificates python3

      - name: Locate Godot project directory
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_FILE="$(find . -name project.godot -print -quit)"
          if [ -z "${PROJECT_FILE:-}" ]; then
            echo "ERROR: Could not find project.godot in repo."
            exit 1
          fi
          PROJECT_DIR="$(cd "$(dirname "$PROJECT_FILE")" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project.godot at: $PROJECT_FILE"
          echo "Using PROJECT_DIR: $PROJECT_DIR"

      - name: Download Godot headless
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          GODOT_ZIP="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          wget -O .cache/godot/godot.zip "$URL"
          unzip -o .cache/godot/godot.zip -d .cache/godot
          chmod +x ".cache/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "$GITHUB_WORKSPACE/.cache/godot" >> "$GITHUB_PATH"

      - name: Install export templates (tpz is a ZIP)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/godot
          TPZ="Godot_v${GODOT_VERSION}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${TPZ}"
          wget --tries=5 --timeout=60 -O .cache/godot/templates.tpz "$URL"

          DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIRNAME}"
          mkdir -p "$DEST"

          TMP="$(mktemp -d)"
          unzip -q -o .cache/godot/templates.tpz -d "$TMP"

          if [ -d "$TMP/templates" ]; then
            cp -a "$TMP/templates/." "$DEST/"
          else
            cp -a "$TMP/." "$DEST/"
          fi

          echo "Installed templates to: $DEST"
          ls -la "$DEST" | head -n 60
          test -f "$DEST/web_release.zip"
          test -f "$DEST/web_debug.zip"

      - name: Ensure Web export preset exists (next to project.godot)
        shell: bash
        run: |
          set -euxo pipefail
          PRESETS="$PROJECT_DIR/export_presets.cfg"

          if [ ! -f "$PRESETS" ]; then
            cat > "$PRESETS" <<'CFG'
[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]
CFG
          else
            if ! grep -q 'platform="Web"' "$PRESETS"; then
              cat >> "$PRESETS" <<'CFG'

[preset.99]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.99.options]
CFG
            fi
          fi

          echo "----- export_presets.cfg (first 120 lines) -----"
          sed -n '1,120p' "$PRESETS"

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/${EXPORT_DIR}"

          Godot_v${GODOT_VERSION}_linux.x86_64 --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-release "Web" "$GITHUB_WORKSPACE/${EXPORT_DIR}/index.html"

          ls -la "$GITHUB_WORKSPACE/${EXPORT_DIR}" | head -n 80
          test -f "$GITHUB_WORKSPACE/${EXPORT_DIR}/index.html"

      - name: Add PWA files (manifest + service worker)
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/${EXPORT_DIR}"

          # These must exist in your repo
          test -f "$GITHUB_WORKSPACE/pwa/manifest.webmanifest"
          test -f "$GITHUB_WORKSPACE/pwa/icon-192.png"
          test -f "$GITHUB_WORKSPACE/pwa/icon-512.png"
          test -f "$GITHUB_WORKSPACE/pwa/sw.js"

          cp "$GITHUB_WORKSPACE/pwa/manifest.webmanifest" "$OUT/manifest.webmanifest"
          cp "$GITHUB_WORKSPACE/pwa/icon-192.png" "$OUT/icon-192.png"
          cp "$GITHUB_WORKSPACE/pwa/icon-512.png" "$OUT/icon-512.png"

          python3 - <<'PY'
import os, json
out = os.environ["OUT"]
files = []
for root, dirs, filenames in os.walk(out):
    for f in filenames:
        if f in ("sw.js", "_precache.json"):
            continue
        full = os.path.join(root, f)
        rel = os.path.relpath(full, out).replace("\\", "/")
        files.append("./" + rel)
files.sort()
with open(os.path.join(out, "_precache.json"), "w", encoding="utf-8") as fp:
    json.dump(files, fp)
PY

          python3 - <<'PY'
import os, json
out = os.environ["OUT"]
tpl_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "pwa", "sw.js")
tpl = open(tpl_path, "r", encoding="utf-8").read()
pre = json.load(open(os.path.join(out, "_precache.json"), "r", encoding="utf-8"))
open(os.path.join(out, "sw.js"), "w", encoding="utf-8").write(
    tpl.replace("__PRECACHE__", json.dumps(pre))
)
PY

          python3 - <<'PY'
import os, re
out = os.environ["OUT"]
p = os.path.join(out, "index.html")
html = open(p, "r", encoding="utf-8").read()

if "manifest.webmanifest" not in html:
    html = re.sub(r"(</head>)",
                  '  <link rel="manifest" href="manifest.webmanifest">\\n  <meta name="theme-color" content="#0f1115">\\n\\1',
                  html, flags=re.I)

if "navigator.serviceWorker" not in html:
    snippet = """
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
"""
    html = re.sub(r"(</body>)", snippet + "\\1", html, flags=re.I)

open(p, "w", encoding="utf-8").write(html)
PY

          rm -f "$OUT/_precache.json"
          echo "PWA injected OK."
          ls -la "$OUT" | head -n 60
        env:
          OUT: ${{ env.EXPORT_DIR }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
